<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel Réception SANA - Stock + 50/100</title>
<style>body{font-family:Arial;padding:15px;background:#f0f2f5;margin:0}.header{background:#111;color:white;padding:15px;text-align:center}.card{background:white;padding:15px;border-radius:12px;margin-bottom:12px;border-left:5px solid #25D366;box-shadow:0 2px 5px rgba(0,0,0,.1)}.btn-oui{background:#25D366;color:white;padding:14px;border:none;border-radius:8px;width:48%;font-weight:bold;cursor:pointer}.btn-non{background:#ff4444;color:white;padding:14px;border:none;border-radius:8px;width:48%;font-weight:bold;cursor:pointer}.stock-box{background:white;padding:12px;border-radius:8px;margin:10px 0}</style>
</head>
<body>
<script>if(prompt("🔐 Mot de passe Réception SANA:")!=="SANA2024"){alert("Faux");location.href="index.html"}</script>
<div class="header"><h2 style="margin:0">🔴 PANEL RÉCEPTION SANA</h2><small>Temps réel - 50%/100% - Stock</small></div>
<div style="padding:15px">
<div class="stock-box">📦 Nombre de chambres disponibles (temps réel Firebase):<br><b id="stock-view" style="font-size:16px">Chargement...</b><br><small>Si 0 → catégorie bloquée automatiquement pour les clients</small></div>
<div id="liste">Chargement des commandes de tous les téléphones...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue, remove, get, set } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyD0_1oZblysKviAaknavtTZCoM68J9_GKY",
  authDomain: "sana-hotel-internationnal-odie.firebaseapp.com",
  databaseURL: "https://sana-hotel-internationnal-odie-default-rtdb.firebaseio.com",
  projectId: "sana-hotel-internationnal-odie",
  storageBucket: "sana-hotel-internationnal-odie.firebasestorage.app",
  messagingSenderId: "10660407067",
  appId: "1:10660407067:web:7e20b4ab80f4db542a55be"
};
const app = initializeApp(firebaseConfig); const db = getDatabase(app);

// AFFICHAGE STOCK DISPONIBLE
onValue(ref(db,'stock'),(snap)=>{
  if(!snap.exists()){document.getElementById('stock-view').innerText="Stock non créé - Première commande va le créer"; return;}
  let s=snap.val(); let txt="";
  for(let k in s){txt+=`${k}: ${s[k]} | `;}
  document.getElementById('stock-view').innerText=txt;
});

// AFFICHAGE RESERVATIONS AVEC 50%/100%
onValue(ref(db,'reservations'),(snap)=>{
  let div=document.getElementById('liste'); div.innerHTML="";
  if(!snap.exists()){div.innerHTML="<div class='card'>✅ Aucune commande en attente de tous les clients</div>";return;}
  snap.forEach(c=>{let r=c.val();let k=c.key;
    div.innerHTML+=`<div class="card">
    <span style="background:${r.pourcentage==50?'orange':'green'};color:white;padding:4px 8px;border-radius:5px;font-size:12px">${r.statut}</span> <small>${r.date}</small><br>
    <b style="font-size:18px">${r.nom}</b> - ${r.tel}<br>
    🏨 Chambre choisie: <b>${r.cat}</b> (${r.nuits} nuit(s))<br>
    💰 Total séjour: ${r.total} FCFA<br>
    💳 <b>Payé sur Wave: ${r.montant} FCFA (${r.pourcentage}% de ${r.cat})</b><br>
    ${r.pourcentage==50?`<span style="color:red;font-weight:bold">💵 RESTE À PAYER SUR PLACE: ${r.reste} FCFA<br>⚠️ 50% NON REMBOURSABLE</span>`: `<span style="color:green;font-weight:bold">✅ PAYÉ 100% - Rien à demander sur place</span>`}<br>
    📅 ${r.dates}<br>
    🌊 ID Wave client: <b style="color:green">${r.waveId}</b><br>
    🔑 Code: ${r.codeCache} | 🆔 ${r.id}<br><br>
    <button onclick="confirmer('${k}','${r.cat}')" class="btn-oui">✅ J'AI REÇU ${r.montant} FCFA SUR WAVE</button>
    <button onclick="refuser('${k}')" class="btn-non">❌ REFUSER</button>
    </div>`;
  });
});

window.confirmer=async(k,cat)=>{
  if(!confirm("Tu confirmes avoir reçu l'argent sur Wave? Chambre: "+cat+"\\nSi tu confirmes, le stock de "+cat+" va diminuer de 1 pour tous les clients et si 0 ça bloquera."))return;
  let snapStock=await get(ref(db,'stock'));
  let st=snapStock.exists()?snapStock.val():{"Standard 1 Lit":3,"Standard 2 Lits":3,"Confort 1 Lit":2,"Confort 2 Lits":2,"VIP":1,"Suite":1};
  if(st[cat]<=0){alert("Stock déjà à 0 pour "+cat+" - Catégorie déjà bloquée"); await remove(ref(db,'reservations/'+k)); return;}
  st[cat]--;
  await set(ref(db,'stock'),st);
  await remove(ref(db,'reservations/'+k));
  alert("✅ Confirmé! Stock restant "+cat+": "+st[cat]+". Si 0, les clients verront FINI/COMPLET et ne pourront plus commander cette catégorie.");
}

window.refuser=async(k)=>{if(confirm("Refuser cette commande?"))await remove(ref(db,'reservations/'+k));}
</script>
</body>
</html>
