<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Panel Réception PRO - SANA</title>
    <style>
        body {
            font-family: Arial;
            padding: 10px;
            background: #f0f2f5;
            margin: 0
        }

        .header {
            background: #111;
            color: white;
            padding: 12px;
            text-align: center;
            border-radius: 0 0 12px 12px
        }

        .card {
            background: white;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px;
            border-left: 5px solid #25D366
        }

        .btn {
            padding: 7px 9px;
            margin: 2px;
            border: none;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            color: white;
            font-weight: bold
        }

        .btn-plein {
            background: #2E8B57
        }

        .btn-liberer {
            background: #007bff
        }

        .btn-ajout {
            background: #6c757d
        }

        .ligne-cat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9f9f9;
            padding: 8px;
            border-radius: 8px;
            margin: 5px 0
        }

        .histo-card {
            background: white;
            padding: 10px;
            border-radius: 8px;
            margin: 5px 0;
            border-left: 4px solid orange;
            font-size: 12px
        }

        .badge-rec {
            background: #111;
            color: yellow;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 11px
        }
    </style>
</head>

<body>
    <script>
        if (prompt("🔐 Mot de passe Réception:") !== "SANA2024") { location.href = "index.html" }
        let _todayPanel = new Date().toLocaleDateString('fr-FR');
        let _savedPanel = localStorage.getItem('sana_date_rec');
        if (_savedPanel !== _todayPanel) {
            localStorage.removeItem('sana_nom_rec');
            localStorage.removeItem('sana_tel_rec');
            localStorage.removeItem('sana_date_rec');
        }
        let nomRec = localStorage.getItem('sana_nom_rec');
        let telRec = localStorage.getItem('sana_tel_rec');
        if (!nomRec || nomRec.trim() === "") {
            let _n = prompt("👤 Entrez votre NOM:");
            if (!_n || _n.trim() === "") { alert("Nom obligatoire"); location.href = "index.html" }
            else { localStorage.setItem('sana_nom_rec', _n.trim()); nomRec = _n.trim(); }
        }
        if (!telRec || telRec.trim() === "") {
            let _t = prompt("📞 Entrez votre NUMÉRO:");
            if (!_t || _t.trim() === "") { alert("Numéro obligatoire"); location.href = "index.html" }
            else { localStorage.setItem('sana_tel_rec', _t.trim()); telRec = _t.trim(); }
        }
        localStorage.setItem('sana_date_rec', _todayPanel);
    </script>
    <div class="header">
        <h2>🔴 PANEL SANA </h2>
        <div class="badge-rec">👤 <span id="rec-name"></span> - <span id="rec-tel"></span> | <span
                id="date-jour"></span></div>
        <button onclick="changerRecep()"
            style="margin-top:6px;padding:4px 8px;font-size:10px;background:#444;color:white;border:none;border-radius:4px">Changer
            réceptionniste</button>
        <div
            style="background:red;color:white;padding:4px;margin-top:8px;border-radius:6px;font-weight:bold;font-size:11px">
            🚫 AUCUN REMBOURSEMENT - HISTORIQUE + SPORT + PISCINE</div>
    </div>
    <div style="padding:10px">
        <div style="background:white;padding:12px;border-radius:12px;margin:10px 0">
            <b id="stock-view">Chargement...</b>
            <div style="margin-top:10px">
                <div class="ligne-cat"><b>STANDARD</b>
                    <div><button class="btn btn-plein" onclick="remettreStock('STANDARD',12)">=12</button><button
                            class="btn btn-liberer" onclick="libererUne('STANDARD')">+1</button><button
                            class="btn btn-ajout" onclick="ajouterStock('STANDARD')">+X</button></div>
                </div>
                <div class="ligne-cat"><b>CLASSIQUE</b>
                    <div><button class="btn btn-plein" onclick="remettreStock('CLASSIQUE',24)">=24</button><button
                            class="btn btn-liberer" onclick="libererUne('CLASSIQUE')">+1</button><button
                            class="btn btn-ajout" onclick="ajouterStock('CLASSIQUE')">+X</button></div>
                </div>
                <div class="ligne-cat"><b>CONFORT</b>
                    <div><button class="btn btn-plein" onclick="remettreStock('CONFORT',12)">=12</button><button
                            class="btn btn-liberer" onclick="libererUne('CONFORT')">+1</button><button
                            class="btn btn-ajout" onclick="ajouterStock('CONFORT')">+X</button></div>
                </div>
                <div class="ligne-cat"><b>VIP</b>
                    <div><button class="btn btn-plein" onclick="remettreStock('VIP',6)">=6</button><button
                            class="btn btn-liberer" onclick="libererUne('VIP')">+1</button><button class="btn btn-ajout"
                            onclick="ajouterStock('VIP')">+X</button></div>
                </div>
                <div class="ligne-cat"><b>VVIP</b>
                    <div><button class="btn btn-plein" onclick="remettreStock('VVIP',2)">=2</button><button
                            class="btn btn-liberer" onclick="libererUne('VVIP')">+1</button><button
                            class="btn btn-ajout" onclick="ajouterStock('VVIP')">+X</button></div>
                </div>
                <div class="ligne-cat"><b>SUITE</b>
                    <div><button class="btn btn-plein" onclick="remettreStock('SUITE',4)">=4</button><button
                            class="btn btn-liberer" onclick="libererUne('SUITE')">+1</button><button
                            class="btn btn-ajout" onclick="ajouterStock('SUITE')">+X</button></div>
                </div>
                <div class="ligne-cat"><b>APPART</b>
                    <div><button class="btn btn-plein" onclick="remettreStock('APPARTEMENT',4)">=4</button><button
                            class="btn btn-liberer" onclick="libererUne('APPARTEMENT')">+1</button><button
                            class="btn btn-ajout" onclick="ajouterStock('APPARTEMENT')">+X</button></div>
                </div>
            </div>
            <button onclick="remettreTout()"
                style="padding:10px;background:orange;color:white;border:none;border-radius:8px;width:100%;font-weight:bold;margin-top:8px">🔄
                TOUT PLEIN</button>
        </div>
        <div style="background:#111;color:white;padding:10px;border-radius:12px;margin:10px 0">
            <h3 style="margin:5px 0">📊 HISTORIQUE DU JOUR - <span id="stats-jour">0 validées</span></h3>
            <div style="font-size:11px;color:#aaa">Total: <b id="total-jour" style="color:#25D366">0 FCFA</b> | Par: <b
                    id="recap-rec"></b></div>
            <div id="histo-liste" style="margin-top:8px;max-height:400px;overflow:auto"></div>
            <button onclick="supprimerHistoConcepteur()"
                style="margin-top:10px;background:#ff0000;color:white;padding:8px;border:none;border-radius:6px;width:100%;font-size:11px">🗑️
                SUPPRIMER HISTORIQUE (CONCEPTEUR)</button>
        </div>
        <h3>📋 Réservations en attente (Chambre / Sport / Piscine / Combo)</h3>
        <div id="liste"></div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getDatabase, ref, onValue, remove, get, set, push } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
        const firebaseConfig = { apiKey: "AIzaSyD0_1oZblysKviAaknavtTZCoM68J9_GKY", authDomain: "sana-hotel-internationnal-odie.firebaseapp.com", databaseURL: "https://sana-hotel-internationnal-odie-default-rtdb.firebaseio.com", projectId: "sana-hotel-internationnal-odie", storageBucket: "sana-hotel-internationnal-odie.firebasestorage.app", messagingSenderId: "10660407067", appId: "1:10660407067:web:7e20b4ab80f4db542a55be" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const STOCK_INIT = { "STANDARD": 12, "CLASSIQUE": 24, "CONFORT": 12, "VIP": 6, "VVIP": 2, "SUITE": 4, "APPARTEMENT": 4 };
        const LABELS = { "STANDARD": "STANDARD 15000", "CLASSIQUE": "CLASSIQUE 20000", "CONFORT": "CONFORT 30000", "VIP": "VIP 50000", "VVIP": "VVIP 60000", "SUITE": "SUITE 60000", "APPARTEMENT": "APPART 70000" };
        let nomRecep = localStorage.getItem('sana_nom_rec');
        let telRecep = localStorage.getItem('sana_tel_rec');
        let today = new Date().toLocaleDateString('fr-FR');
        document.getElementById('rec-name').innerText = nomRecep;
        document.getElementById('rec-tel').innerText = telRecep;
        document.getElementById('date-jour').innerText = today;
        document.getElementById('recap-rec').innerText = nomRecep;

        function extraireChambre(catString) {
            let upper = catString.toUpperCase();
            for (let k in STOCK_INIT) {
                if (upper.includes(k)) return k;
            }
            return null;
        }

        window.changerRecep = function () {
            let _n = prompt("Nouveau NOM:", nomRecep);
            if (!_n || _n.trim() === "") return;
            let _t = prompt("Nouveau NUMÉRO:", telRecep);
            if (!_t || _t.trim() === "") return;
            localStorage.setItem('sana_nom_rec', _n.trim());
            localStorage.setItem('sana_tel_rec', _t.trim());
            localStorage.setItem('sana_date_rec', new Date().toLocaleDateString('fr-FR'));
            location.reload();
        }
        onValue(ref(db, 'stock'), function (snap) {
            if (!snap.exists()) { set(ref(db, 'stock'), STOCK_INIT); return; }
            let t = ""; let val = snap.val();
            for (let k in val) { t += LABELS[k] + ": " + val[k] + " | "; }
            document.getElementById('stock-view').innerText = t;
        });
        onValue(ref(db, 'reservations'), function (snap) {
            let d = document.getElementById('liste'); d.innerHTML = "";
            if (!snap.exists()) { d.innerHTML = "<div style='text-align:center;padding:15px;color:green'>✅ Aucune réservation</div>"; return; }
            snap.forEach(function (c) {
                let r = c.val(); let k = c.key;
                let montantTxt = (r.montant || 0).toString();
                let typeBadge = r.typeService ? `<span style="background:${r.typeService == 'CHAMBRE' ? '#007bff' : r.typeService == 'SPORT' ? '#ff9800' : '#00bcd4'};color:white;padding:2px 6px;border-radius:4px;font-size:10px">${r.typeService}</span>` : "";
                let detailTxt = r.detailCombo ? `<br><small style="background:#e7f3ff;padding:2px 5px;border-radius:4px;">${r.detailCombo}</small>` : "";
                d.innerHTML += '<div class="card"><b>' + r.nom + '</b> - ' + r.cat.replace(/_/g, ' ') + ' ' + typeBadge + ' (' + (r.nuits || 1) + 'N) - ' + r.tel + '<br>💰 ' + montantTxt + ' (' + r.pourcentage + '%) - ' + r.waveId + '<br>📅 ' + r.dates + detailTxt + '<br><small style="color:red;font-weight:bold">🚫 AUCUN REMBOURSEMENT</small><br><br><button onclick="confirmer(\'' + k + '\')" style="background:#25D366;color:white;padding:10px;border:none;border-radius:8px;width:48%;font-weight:bold">✅ REÇU -1</button> <button onclick="refuser(\'' + k + '\')" style="background:#ff4444;color:white;padding:10px;border:none;border-radius:8px;width:48%;font-weight:bold">❌ REFUSER</button></div>';
            });
        });
        onValue(ref(db, 'historique/' + today.split('/').join('-')), function (snap) {
            let liste = document.getElementById('histo-liste');
            let total = 0; let count = 0; liste.innerHTML = "";
            if (!snap.exists()) {
                document.getElementById('stats-jour').innerText = "0 validée";
                document.getElementById('total-jour').innerText = "0 FCFA";
                return;
            }
            snap.forEach(function (c) {
                let h = c.val(); count++; total += h.montant || 0;
                let dateAffiche = h.dateValidation || (h.date + ' à ' + h.heure);
                let heureAffiche = h.heure || '';
                let receptionnisteAffiche = h.validePar || h.receptionniste;
                let detailHisto = h.detailCombo ? `<br><small>${h.detailCombo}</small>` : "";
                liste.innerHTML += `<div class="histo-card">✅ <b>${h.cat.replace(/_/g, ' ')}</b> ${h.typeService ? `(${h.typeService})` : ""} - ${h.client} - ${(h.montant || 0)}F (${h.pourcentage}%)${detailHisto}<br>📅 <b style="color:yellow;background:#111;padding:2px 6px;border-radius:4px;">${dateAffiche} ${heureAffiche}</b><br>👤 Validé par : <b style="color:green;">${receptionnisteAffiche}</b> (${h.telRec})<br><small>ID: ${h.waveId}</small></div>`;
            });
            document.getElementById('stats-jour').innerText = count + ' validée(s)';
            document.getElementById('total-jour').innerText = total.toLocaleString() + " FCFA";
        });
        window.confirmer = async function (k) {
            try {
                let resSnap = await get(ref(db, 'reservations/' + k));
                if (!resSnap.exists()) { alert("Déjà supprimée"); return; }
                let res = resSnap.val(); let cat = res.cat; let montant = res.montant;
                let catChambre = extraireChambre(cat);
                let typeService = res.typeService || "CHAMBRE";
                if (!confirm("Confirmer " + cat + " pour " + res.nom + "?\n" + (res.detailCombo || ""))) return;

                if (catChambre) {
                    let s = (await get(ref(db, 'stock'))).val() || STOCK_INIT;
                    if ((s[catChambre] || 0) <= 0) { alert(catChambre + " COMPLET"); return; }
                    s[catChambre]--; await set(ref(db, 'stock'), s);
                }

                let histoKey = today.split('/').join('-');
                let now = new Date();
                let dateHeureComplete = now.toLocaleDateString('fr-FR') + ' à ' + now.toLocaleTimeString('fr-FR');
                await push(ref(db, 'historique/' + histoKey), {
                    date: today,
                    heure: now.toLocaleTimeString('fr-FR'),
                    dateValidation: dateHeureComplete,
                    validePar: nomRecep,
                    receptionniste: nomRecep,
                    telRec: telRecep,
                    cat: cat,
                    typeService: typeService,
                    detailCombo: res.detailCombo || "",
                    catLabel: catChambre ? LABELS[catChambre] : cat,
                    client: res.nom,
                    telClient: res.tel,
                    montant: montant,
                    pourcentage: res.pourcentage || 50,
                    waveId: res.waveId || "",
                    totalSejour: res.total || 0
                });
                await remove(ref(db, 'reservations/' + k));
                let msgStock = catChambre ? `Reste ${LABELS[catChambre]}: ${(await get(ref(db, 'stock'))).val()[catChambre]}` : "Pas de stock à décrémenter (Sport/Piscine)";
                alert("✅ Validé par " + nomRecep + " le " + dateHeureComplete + "\n" + msgStock);
            } catch (e) { alert("ERREUR: " + e.message); console.error(e); }
        }
        window.refuser = async function (k) { if (confirm("Refuser?")) await remove(ref(db, 'reservations/' + k)); }
        window.libererUne = async function (cat) { let s = (await get(ref(db, 'stock'))).val() || STOCK_INIT; s[cat]++; await set(ref(db, 'stock'), s); alert("+1 " + LABELS[cat] + " -> " + s[cat]); }
        window.ajouterStock = async function (cat) { let q = prompt("Combien ajouter à " + LABELS[cat] + "?"); if (!q) return; q = parseInt(q); if (isNaN(q)) return; let s = (await get(ref(db, 'stock'))).val() || STOCK_INIT; s[cat] = (s[cat] || 0) + q; await set(ref(db, 'stock'), s); alert("+" + q + " -> " + s[cat]); }
        window.remettreStock = async function (c, q) { if (!confirm("Remettre " + LABELS[c] + " à " + q + "?")) return; let s = (await get(ref(db, 'stock'))).val() || {}; s[c] = q; await set(ref(db, 'stock'), s); }
        window.remettreTout = async function () { if (!confirm("Tout remettre plein?")) return; await set(ref(db, 'stock'), STOCK_INIT); }
        window.supprimerHistoConcepteur = async function () {
            let code = prompt("🔒 Code Concepteur:");
            if (code !== "SANA2024MASTER") { alert("❌ Code faux"); return; }
            if (!confirm("Supprimer historique du " + today + "?")) return;
            await remove(ref(db, 'historique/' + today.split('/').join('-')));
            alert("✅ Supprimé");
        }
    </script>
</body>

</html>
