<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Panel Réception - SANA</title><style>body{font-family:Arial;padding:20px;background:#f5f5f5}.card{background:white;padding:15px;border-radius:10px;margin-bottom:15px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}.btn-ok{background:#25D366;color:white;padding:12px;border:none;border-radius:8px;width:48%;font-weight:bold;cursor:pointer}.btn-no{background:#ff4444;color:white;padding:12px;border:none;border-radius:8px;width:48%;font-weight:bold;cursor:pointer}</style></head><body>
<h2>Panel Réceptionniste - Vérification Wave</h2>
<p>Ouvrez votre appli Wave et vérifiez chaque ID avant de confirmer.</p>
<div id="liste"></div>
<script>
function getStock(){let s=localStorage.getItem('sana_stock');return s?JSON.parse(s):{"Standard 1 Lit":3,"Standard 2 Lits":3,"Confort 1 Lit":2,"Confort 2 Lits":2,"VIP":1,"Suite":1};}
function saveStock(stock){localStorage.setItem('sana_stock',JSON.stringify(stock));}
function afficher(){
let res=JSON.parse(localStorage.getItem('sana_reservations_pending')||"[]");
let div=document.getElementById('liste');div.innerHTML="";
if(res.length===0){div.innerHTML="<p>Aucune demande en attente</p>";return;}
res.forEach((r,i)=>{
let html=`<div class="card"><b>${r.nom} - ${r.tel}</b><br>Chambre: ${r.cat} - ${r.montant} FCFA<br>Dates: ${r.dates}<br>ID Wave: <b>${r.waveId}</b><br>Code: ${r.codeCache} / ${r.codeClient}<br>Statut: <span style="color:orange;font-weight:bold">${r.statut}</span><br><small>${r.date} - ${r.id}</small><br><br>
<button class="btn-ok" onclick="confirmer(${i})">✅ J'AI REÇU SUR WAVE - CONFIRMER</button> <button class="btn-no" onclick="refuser(${i})">❌ PAS D'ARGENT - REFUSER</button></div>`;
div.innerHTML+=html;
});
}
function confirmer(i){
let res=JSON.parse(localStorage.getItem('sana_reservations_pending')||"[]");
let r=res[i];
let stock=getStock();
if(stock[r.cat]<=0){alert("Plus de stock pour "+r.cat);return;}
if(!confirm("Tu confirmes avoir VRAIMENT reçu "+r.montant+" FCFA sur Wave pour "+r.nom+"?\nID Wave: "+r.waveId)){return;}
stock[r.cat]--;saveStock(stock);
res.splice(i,1);localStorage.setItem('sana_reservations_pending',JSON.stringify(res));
alert("✅ Réservation confirmée! Chambre "+r.cat+" décomptée. Stock restant: "+stock[r.cat]);
afficher();
}
function refuser(i){
let res=JSON.parse(localStorage.getItem('sana_reservations_pending')||"[]");
if(!confirm("Refuser cette réservation? Le client n'a pas payé?"))return;
res.splice(i,1);localStorage.setItem('sana_reservations_pending',JSON.stringify(res));
afficher();
}
afficher();
</script></body></html>
