<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel Réception - SANA</title><style>body{font-family:Arial;padding:15px;background:#f0f2f5}.card{background:white;padding:15px;border-radius:12px;margin-bottom:12px;border-left:5px solid #25D366}</style></head><body>
<script>if(prompt("🔐 Mot de passe:")!=="SANA2024"){location.href="index.html"}</script>
<h2>🔴 Panel Réception - En direct</h2>
<div id="liste">Chargement des commandes de tous les téléphones...</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyD0_1oZblysKviAaknavtTZCoM68J9_GKY",
  authDomain: "sana-hotel-internationnal-odie.firebaseapp.com",
  databaseURL: "https://sana-hotel-internationnal-odie-default-rtdb.firebaseio.com",
  projectId: "sana-hotel-internationnal-odie",
  storageBucket: "sana-hotel-internationnal-odie.firebasestorage.app",
  messagingSenderId: "10660407067",
  appId: "1:10660407067:web:7e20b4ab80f4db542a55be"
};
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
function getStock(){let s=localStorage.getItem('sana_stock');return s?JSON.parse(s):{"Standard 1 Lit":3,"Standard 2 Lits":3,"Confort 1 Lit":2,"Confort 2 Lits":2,"VIP":1,"Suite":1};}
function saveStock(st){localStorage.setItem('sana_stock',JSON.stringify(st));}
onValue(ref(db,'reservations'),(snap)=>{
  let div=document.getElementById('liste');div.innerHTML="";
  if(!snap.exists()){div.innerHTML="✅ Aucune commande en attente";return;}
  snap.forEach(c=>{let r=c.val();let k=c.key;
  div.innerHTML+=`<div class="card"><b>${r.nom} - ${r.tel}</b><br>${r.cat} - ${r.montant} FCFA<br>${r.dates}<br>ID Wave: <b style="color:green">${r.waveId}</b><br><small>${r.date}</small><br><br><button onclick="confirmer('${k}','${r.cat}')" style="background:#25D366;color:white;padding:12px;border:none;border-radius:8px;width:48%">✅ REÇU WAVE</button> <button onclick="refuser('${k}')" style="background:#ff4444;color:white;padding:12px;border:none;border-radius:8px;width:48%">❌ REFUSER</button></div>`;
  });
});
window.confirmer=async(k,cat)=>{if(!confirm("Tu as VRAIMENT reçu sur Wave?"))return;let st=getStock();if(st[cat]<=0){alert("COMPLET");return;}st[cat]--;saveStock(st);await remove(ref(db,'reservations/'+k));alert("Confirmé! Reste "+st[cat]);}
window.refuser=async(k)=>{if(confirm("Refuser?"))await remove(ref(db,'reservations/'+k));}
</script></body></html>
