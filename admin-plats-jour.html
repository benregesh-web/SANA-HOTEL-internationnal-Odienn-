<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Admin SANA - Programmation Menu</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 15px
        }

        .box {
            background: white;
            padding: 15px;
            border-radius: 12px;
            max-width: 850px;
            margin: 20px auto;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .1)
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            color: white
        }

        .cache {
            display: none
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 8px
        }

        .jour-box {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            margin: 8px 0;
            background: #fafafa
        }

        .jour-box.aujourd {
            border: 2px solid #25D366;
            background: #e8f5e9
        }

        .plat-check {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 13px;
            margin: 4px 0;
            background: white;
            padding: 6px;
            border-radius: 6px
        }
    </style>
</head>

<body>

    <div id="login" class="box">
        <h2>🔐 Admin SANA HOTEL</h2>
        <input type="password" id="code-secret" placeholder="Code admin">
        <button class="btn" style="background:#111" onclick="verifierCode()">Entrer</button>
        <p id="msg-login" style="color:red"></p>
    </div>

    <div id="admin" class="box cache">
        <h2>🍽️ SANA - Gestion Menu <span id="date-jour" style="color:#2E8B57"></span></h2>
        <input type="text" id="nom-receptionniste" placeholder="Nom réceptionniste *">

        <div id="auto-info" style="background:#d4edda;padding:10px;border-radius:8px;margin-bottom:10px;display:none">
        </div>

        <h3>1. ➕ Ajouter un plat (sort direct dans MENU)</h3>
        <div style="background:#fff8f0;padding:12px;border-radius:8px;border:2px dashed #c89b3c">
            <input id="new-nom" placeholder="Ex: Chawarma Viande ou Poulet">
            <input id="new-prix" type="number" placeholder="Prix ex: 1000">
            <select id="new-cat">
                <option value="africain">Africain / Spécial</option>
                <option value="poulet">Poulet</option>
                <option value="poisson">Poisson</option>
                <option value="agouti">Agouti</option>
                <option value="fastfood">Fastfood</option>
                <option value="crudite">Crudité / Petit Déj</option>
            </select>
            <button class="btn" style="background:#c89b3c;color:#000" onclick="ajouterPlat()">💾 AJOUTER DANS LA
                CARTE</button>
            <div id="liste-gestion" style="max-height:300px;overflow:auto;margin-top:10px"></div>
        </div>

        <h3>2. ✅ Valider Plats du Jour (Aujourd'hui)</h3>
        <div id="liste-plats-admin"
            style="border:1px solid #eee;padding:10px;border-radius:8px;max-height:300px;overflow:auto"></div>
        <button class="btn" style="background:#25D366;font-size:18px" onclick="validerPlatsJour()">✅ VALIDER AUJOURD'HUI
            → MENU CLIENT</button>

        <h3>3. 📅 Programmer SEMAINE</h3>
        <div style="background:#e3f2fd;padding:12px;border-radius:8px;border:2px solid #2196F3">
            <div id="programme-semaine"></div>
            <button class="btn" style="background:#2196F3" onclick="sauvegarderSemaine()">💾 SAUVEGARDER
                SEMAINE</button>
            <button class="btn" style="background:#111" onclick="appliquerAujourdhui()">▶️ Appliquer
                aujourd'hui</button>
        </div>

        <h3>4. 📆 Programmer MOIS (Nouveau)</h3>
        <div style="background:#fff3cd;padding:12px;border-radius:8px;border:2px solid #c89b3c">
            <input type="date" id="date-mois">
            <div id="liste-plats-mois"
                style="max-height:200px;overflow:auto;background:white;padding:8px;border-radius:6px;margin:8px 0">
            </div>
            <button class="btn" style="background:#c89b3c;color:#000" onclick="sauvegarderMois()">💾 Programmer ce jour
                du mois</button>
            <div id="liste-mois-saved" style="margin-top:10px"></div>
        </div>

        <h3>📜 Historique</h3>
        <div id="historique" style="max-height:200px;overflow:auto;background:#fafafa;padding:10px;border-radius:8px">
        </div>
        <button onclick="logout()" class="btn" style="background:gray">Déconnexion</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getDatabase, ref, set, get, child, push, remove } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
        const firebaseConfig = { apiKey: "AIzaSyD0_1oZblysKviAaknavtTZCoM68J9_GKY", authDomain: "sana-hotel-internationnal-odie.firebaseapp.com", databaseURL: "https://sana-hotel-internationnal-odie-default-rtdb.firebaseio.com", projectId: "sana-hotel-internationnal-odie", storageBucket: "sana-hotel-internationnal-odie.firebasestorage.app", messagingSenderId: "10660407067", appId: "1:10660407067:web:7e20b4ab80f4db542a55be" };
        const app = initializeApp(firebaseConfig); const db = getDatabase(app);
        const CODE_ADMIN = atob("U0FOQTIwMjY="); // SANA2026
        let platsBase = []; let platsCoches = new Set(); let programmeSemaine = {};

        document.getElementById('date-jour').innerText = new Date().toLocaleDateString('fr-FR');

        window.verifierCode = async function () {
            if (document.getElementById('code-secret').value !== CODE_ADMIN) { document.getElementById('msg-login').innerText = "Code faux"; return; }
            document.getElementById('login').classList.add('cache'); document.getElementById('admin').classList.remove('cache');
            await chargerCarte(); await chargerProgrammeSemaine(); await appliquerProgrammeAuto(); chargerHistorique();
        }

        async function chargerCarte() {
            let snap = await get(child(ref(db), 'menu_items')); platsBase = [];
            if (snap.exists()) { snap.forEach(c => { let v = c.val(); v.key = c.key; platsBase.push(v); }); }
            document.getElementById('liste-gestion').innerHTML = platsBase.map(p => `<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee"><span><b>${p.nom}</b> - ${p.prix}F <small>(${p.cat})</small></span><button style="background:#e74c3c;color:white;border:none;padding:4px 8px;border-radius:5px" onclick="supprimerCarte('${p.key}')">🗑️</button></div>`).join('') || "<i>Aucun plat</i>";
            afficherPlats();
            genererUIProgramme(); genererUIMois();
        }

        function afficherPlats() {
            let div = document.getElementById('liste-plats-admin');
            div.innerHTML = platsBase.map(p => `<label class="plat-check"><input type="checkbox" ${platsCoches.has(p.nom) ? 'checked' : ''} onchange="togglePlat('${p.nom.replace(/'/g, "\\'")}')"> <b>${p.nom}</b> - ${p.prix}F</label>`).join('') || "<i>Ajoute des plats d'abord</i>";
        }
        window.togglePlat = function (n) { if (platsCoches.has(n)) platsCoches.delete(n); else platsCoches.add(n); }

        window.ajouterPlat = async function () {
            let nom = document.getElementById('new-nom').value.trim(); let prix = parseInt(document.getElementById('new-prix').value); let cat = document.getElementById('new-cat').value;
            if (!nom || !prix) return alert("Nom + Prix");
            await push(ref(db, 'menu_items'), { nom, prix, cat });
            document.getElementById('new-nom').value = ""; document.getElementById('new-prix').value = "";
            await chargerCarte();
        }

        window.supprimerCarte = async function (key) { if (!confirm("Supprimer?")) return; await remove(ref(db, 'menu_items/' + key)); await chargerCarte(); }

        window.validerPlatsJour = async function () {
            let rec = document.getElementById('nom-receptionniste').value.trim(); if (!rec) return alert("Nom réceptionniste"); if (platsCoches.size == 0) return alert("Coche au moins 1 plat");
            let data = { date: new Date().toLocaleDateString('fr-FR'), dateISO: new Date().toISOString().split('T')[0], heure: new Date().toLocaleTimeString('fr-FR'), receptionniste: rec, plats: Array.from(platsCoches), timestamp: Date.now(), source: 'manuel' };
            await set(ref(db, 'plats_du_jour_actuels'), data); await set(ref(db, 'historique_plats/' + data.dateISO + '_' + Date.now()), data);
            alert("✅ Menu du jour validé -> visible sur menu.html"); chargerHistorique();
        }

        // SEMAINE
        async function chargerProgrammeSemaine() { let snap = await get(child(ref(db), 'programme_semaine')); programmeSemaine = snap.exists() ? snap.val() : {}; genererUIProgramme(); }
        function getSemaineDates() { let dates = []; let today = new Date(); let day = today.getDay(); let lundi = new Date(today); lundi.setDate(today.getDate() - (day == 0 ? 6 : day - 1)); for (let i = 0; i < 7; i++) { let d = new Date(lundi); d.setDate(lundi.getDate() + i); dates.push(d); } return dates; }
        function genererUIProgramme() {
            let dates = getSemaineDates(); let c = document.getElementById('programme-semaine');
            c.innerHTML = dates.map(d => { let iso = d.toISOString().split('T')[0]; let label = d.toLocaleDateString('fr-FR', { weekday: 'long', day: '2-digit', month: 'short' }); let isToday = iso === new Date().toISOString().split('T')[0]; let prog = programmeSemaine[iso] || []; return `<div class="jour-box ${isToday ? 'aujourd' : ''}"><b>${label} ${isToday ? '🔴 Aujourd\'hui' : ''}</b> - ${iso}<div style="margin-top:6px">${platsBase.map(p => `<label class="plat-check"><input type="checkbox" value="${p.nom}" data-date="${iso}" ${prog.includes(p.nom) ? 'checked' : ''}> ${p.nom}</label>`).join('')}</div></div>`; }).join('');
        }
        window.sauvegarderSemaine = async function () { let boxes = document.querySelectorAll('#programme-semaine input[type=checkbox]'); let prog = {}; boxes.forEach(cb => { let d = cb.getAttribute('data-date'); if (!prog[d]) prog[d] = []; if (cb.checked) prog[d].push(cb.value); }); await set(ref(db, 'programme_semaine'), prog); programmeSemaine = prog; alert("✅ Semaine sauvegardée"); appliquerProgrammeAuto(); }
        window.appliquerProgrammeAuto = async function () { let todayISO = new Date().toISOString().split('T')[0]; let platsToday = programmeSemaine[todayISO]; let info = document.getElementById('auto-info'); if (platsToday && platsToday.length > 0) { let data = { date: new Date().toLocaleDateString('fr-FR'), dateISO: todayISO, heure: new Date().toLocaleTimeString('fr-FR'), receptionniste: 'Auto-Semaine', plats: platsToday, timestamp: Date.now(), source: 'auto-semaine' }; await set(ref(db, 'plats_du_jour_actuels'), data); info.style.display = 'block'; info.innerHTML = `🤖 Auto aujourd'hui (${todayISO}): ${platsToday.join(', ')}`; } else { info.style.display = 'block'; info.innerHTML = `ℹ️ Aucun programme pour aujourd'hui`; } }
        window.appliquerAujourdhui = async function () { await appliquerProgrammeAuto(); alert("Appliqué"); }

        // MOIS
        function genererUIMois() { document.getElementById('liste-plats-mois').innerHTML = platsBase.map(p => `<label class="plat-check"><input type="checkbox" value="${p.nom}" class="check-mois"> ${p.nom} - ${p.prix}F</label>`).join(''); chargerMoisSaved(); }
        async function chargerMoisSaved() { let snap = await get(child(ref(db), 'programme_semaine')); let div = document.getElementById('liste-mois-saved'); if (!snap.exists()) { div.innerHTML = "<small>Aucun jour programmé</small>"; return; } let entries = Object.entries(snap.val()).sort(); div.innerHTML = entries.map(([date, plats]) => `<div style="display:flex;justify-content:space-between;padding:5px;border-bottom:1px solid #ddd;font-size:13px"><span><b>${date}</b>: ${plats.join(', ')}</span><button style="background:#e74c3c;color:white;border:none;padding:2px 6px;border-radius:4px" onclick="supprDate('${date}')">X</button></div>`).join(''); }
        window.sauvegarderMois = async function () { let date = document.getElementById('date-mois').value; if (!date) return alert("Choisis une date"); let checks = document.querySelectorAll('.check-mois:checked'); let plats = Array.from(checks).map(c => c.value); if (plats.length == 0) return alert("Coche des plats"); await set(ref(db, 'programme_semaine/' + date), plats); alert("✅ " + date + " programmé: " + plats.join(', ')); chargerMoisSaved(); if (date === new Date().toISOString().split('T')[0]) appliquerProgrammeAuto(); }
        window.supprDate = async function (date) { if (!confirm("Supprimer " + date + "?")) return; await remove(ref(db, 'programme_semaine/' + date)); chargerMoisSaved(); }

        async function chargerHistorique() { let snap = await get(child(ref(db), 'historique_plats')); let div = document.getElementById('historique'); if (!snap.exists()) { div.innerHTML = "Aucun"; return; } let arr = []; snap.forEach(c => arr.push(c.val())); arr.sort((a, b) => b.timestamp - a.timestamp); div.innerHTML = arr.slice(0, 10).map(h => `<div style="padding:6px 0;border-bottom:1px solid #eee"><b>${h.date}</b> - ${h.receptionniste}<br><small>${h.plats.join(', ')}</small></div>`).join(''); }
        window.logout = function () { document.getElementById('admin').classList.add('cache'); document.getElementById('login').classList.remove('cache'); }
    </script>
</body>

</html>
