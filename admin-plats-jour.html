<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Admin Plats SANA</title>
<style>body{font-family:Arial;background:#f5f5f5;padding:15px}.box{background:white;padding:15px;border-radius:12px;max-width:700px;margin:20px auto}.plat-item{display:flex;justify-content:space-between;padding:8px;border:1px solid #ddd;margin:4px 0;border-radius:8px;cursor:pointer}.plat-item.selected{background:#e8f5e9;border-color:#2E8B57}.btn{padding:12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;width:100%;margin-top:8px;color:white}.cache{display:none} input,select{width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:6px}</style>
</head><body>
<div id="login" class="box"><h2>🔐 Admin Restaurant</h2><input type="password" id="code-secret" placeholder="Code"><button class="btn" style="background:#111" onclick="verifierCode()">Entrer</button><p id="msg-login" style="color:red"></p><small>Code: SANA2026</small></div>
<div id="admin" class="box cache">
<h2>🍽️ Plats du Jour - <span id="date-jour"></span></h2>
<input type="text" id="nom-receptionniste" placeholder="Nom réceptionniste du jour *">
<h3>1. Gérer la carte (Photo + Prix)</h3>
<div style="background:#fff8f0;padding:10px;border-radius:8px;border:1px dashed #c89b3c">
<input id="new-nom" placeholder="Nom plat ex: Poulet Braisé">
<input id="new-prix" type="number" placeholder="Prix ex: 5000">
<input id="new-photo" placeholder="Lien photo ou nom fichier ex: pouletalloco.png">
<select id="new-cat"><option value="africain">Africain</option><option value="fastfood">Fastfood</option><option value="poulet">Poulet</option><option value="poisson">Poisson</option><option value="crudite">Crudité</option><option value="petitdej">Petit Déj</option></select>
<button class="btn" style="background:#c89b3c" onclick="ajouterOuModifierPlat()">💾 Ajouter / Modifier plat (Photo + Prix)</button>
<div id="liste-gestion" style="max-height:200px;overflow:auto;margin-top:10px"></div>
</div>
<h3>2. Cocher plats disponibles aujourd'hui</h3>
<div id="liste-plats-admin"></div>
<button class="btn" style="background:#25D366;font-size:18px" onclick="validerPlatsJour()">✅ VALIDER PLATS DU JOUR (clients verront seulement ça)</button>
<div id="confirmation" class="cache" style="background:#d4edda;padding:10px;border-radius:8px;margin-top:10px"></div>
<h3>📜 Historique</h3><div id="historique" style="max-height:200px;overflow:auto;background:#fff8f0;padding:10px;border-radius:8px"></div>
<button onclick="logout()" class="btn" style="background:gray">Déconnexion</button>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, set, get, child, push } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyD0_1oZblysKviAaknavtTZCoM68J9_GKY",authDomain:"sana-hotel-internationnal-odie.firebaseapp.com",databaseURL:"https://sana-hotel-internationnal-odie-default-rtdb.firebaseio.com",projectId:"sana-hotel-internationnal-odie",storageBucket:"sana-hotel-internationnal-odie.firebasestorage.app",messagingSenderId:"10660407067",appId:"1:10660407067:web:7e20b4ab80f4db542a55be"};
const app=initializeApp(firebaseConfig);const db=getDatabase(app);
const CODE_ADMIN="SANA2026";
let platsBase=[]; let platsCoches=new Set();
document.getElementById('date-jour').innerText=new Date().toLocaleDateString('fr-FR');
window.verifierCode=async function(){
 if(document.getElementById('code-secret').value!==CODE_ADMIN){document.getElementById('msg-login').innerText="Code faux";return;}
 document.getElementById('login').classList.add('cache');document.getElementById('admin').classList.remove('cache');
 await chargerCarte(); afficherPlats(); chargerHistorique();
}
async function chargerCarte(){
 let snap=await get(child(ref(db),'menu_items'));
 platsBase=[]; document.getElementById('liste-gestion').innerHTML="";
 if(snap.exists()){
  snap.forEach(c=>{let v=c.val(); v.key=c.key; platsBase.push(v);});
  document.getElementById('liste-gestion').innerHTML=platsBase.map(p=>`<div style="display:flex;justify-content:space-between;font-size:12px;border-bottom:1px solid #eee;padding:4px"><span>${p.nom} - ${p.prix}F <small>(${p.photo})</small></span><button onclick="remplirForm('${p.nom.replace(/'/g,"\\'")}',${p.prix},'${p.photo}','${p.cat}')">✏️</button></div>`).join('');
 } else {
  // première fois: créer à partir de ton ancien menu
  let def=[{nom:"Chawarma Viande ou Poulet",prix:1000,photo:"pain1.jpg",cat:"fastfood"},{nom:"Poulet Braisé + Alloco",prix:5000,photo:"pouletalloco.png",cat:"poulet"},{nom:"Poisson Carpe",prix:6000,photo:"poisson.png",cat:"poisson"}];
  for(let p of def){await push(ref(db,'menu_items'),p);}
  chargerCarte();
 }
}
window.remplirForm=function(n,p,ph,c){document.getElementById('new-nom').value=n;document.getElementById('new-prix').value=p;document.getElementById('new-photo').value=ph;document.getElementById('new-cat').value=c;}
window.ajouterOuModifierPlat=async function(){
 let nom=document.getElementById('new-nom').value.trim();let prix=parseInt(document.getElementById('new-prix').value);let photo=document.getElementById('new-photo').value.trim()||'pouletalloco.png';let cat=document.getElementById('new-cat').value;
 if(!nom||!prix) return alert("Nom + Prix obligatoires");
 let snap=await get(child(ref(db),'menu_items')); let keyExist=null;
 if(snap.exists()){snap.forEach(c=>{if(c.val().nom.toLowerCase()===nom.toLowerCase()) keyExist=c.key;});}
 if(keyExist){await set(ref(db,'menu_items/'+keyExist),{nom,prix,photo,cat});} else {await push(ref(db,'menu_items'),{nom,prix,photo,cat});}
 alert("✅ Plat enregistré"); chargerCarte(); afficherPlats();
}
function afficherPlats(){
 let div=document.getElementById('liste-plats-admin');
 div.innerHTML=platsBase.map(p=>`<div class="plat-item ${platsCoches.has(p.nom)?'selected':''}" onclick="togglePlat('${p.nom.replace(/'/g,"\\'")}')"><span><img src="${p.photo}" style="width:30px;height:30px;object-fit:cover;border-radius:4px;vertical-align:middle;margin-right:6px">${p.nom} - ${p.prix}F</span><input type="checkbox" ${platsCoches.has(p.nom)?'checked':''}></div>`).join('');
}
window.togglePlat=function(plat){if(platsCoches.has(plat))platsCoches.delete(plat);else platsCoches.add(plat);afficherPlats();}
window.validerPlatsJour=async function(){
 let nom=document.getElementById('nom-receptionniste').value.trim(); if(!nom)return alert("Nom réceptionniste"); if(platsCoches.size==0)return alert("Coche 1 plat");
 let auj=new Date(); let data={date:auj.toLocaleDateString('fr-FR'),dateISO:auj.toISOString().split('T')[0],heure:auj.toLocaleTimeString('fr-FR'),receptionniste:nom,plats:Array.from(platsCoches),timestamp:Date.now()};
 await set(ref(db,'plats_du_jour_actuels'),data); await set(ref(db,'historique_plats/'+data.dateISO+'_'+Date.now()),data);
 document.getElementById('confirmation').innerHTML=`Validé par ${nom}: ${Array.from(platsCoches).join(', ')}`; document.getElementById('confirmation').classList.remove('cache'); chargerHistorique();
}
async function chargerHistorique(){let snap=await get(child(ref(db),'historique_plats'));let div=document.getElementById('historique'); if(!snap.exists()){div.innerHTML="Aucune";return;} let vals=Object.values(snap.val()).sort((a,b)=>b.timestamp-a.timestamp).slice(0,10); div.innerHTML=vals.map(v=>`<div style="padding:5px 0;border-bottom:1px solid #ddd"><b>${v.date} ${v.heure}</b> - ${v.receptionniste}<br><small>${v.plats.join(', ')}</small></div>`).join('');}
window.logout=function(){document.getElementById('admin').classList.add('cache');document.getElementById('login').classList.remove('cache');}
</script></body></html>
