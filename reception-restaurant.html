<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réception Restaurant - SANA</title>
<style>body{font-family:Arial;padding:15px;background:#f0f2f5;margin:0}.header{background:#111;color:white;padding:15px;text-align:center}.card{background:white;padding:15px;border-radius:12px;margin-bottom:12px;border-left:5px solid #25D366}.btn-oui{background:#25D366;color:white;padding:14px;border:none;border-radius:8px;width:48%;font-weight:bold}.btn-non{background:#ff4444;color:white;padding:14px;border:none;border-radius:8px;width:48%;font-weight:bold}.nav-links a{display:inline-block;padding:8px 12px;margin:5px;background:#2E8B57;color:white;text-decoration:none;border-radius:6px;font-weight:bold}</style></head>
<body>
<script>if(prompt("Mot de passe Réception:")!=="SANA2024"){location.href="index.html"}</script>
<div class="header">
<h2>🍔 RÉCEPTION RESTAURANT</h2>
<div class="nav-links">
<a href="admin-plats.html">🔧 Admin Plats du Jour / Photos & Prix</a>
<a href="menu.html" style="background:#c89b3c">🖼️ Voir Galerie Menu Client</a>
</div>
<div style="background:red;color:white;padding:8px;border-radius:6px;margin-top:10px;font-weight:bold">🚫 AUCUN REMBOURSEMENT UNE FOIS VALIDÉE</div>
</div>
<div style="padding:10px"><b id="total-commandes"></b><div id="liste"></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyD0_1oZblysKviAaknavtTZCoM68J9_GKY",authDomain:"sana-hotel-internationnal-odie.firebaseapp.com",databaseURL:"https://sana-hotel-internationnal-odie-default-rtdb.firebaseio.com",projectId:"sana-hotel-internationnal-odie",storageBucket:"sana-hotel-internationnal-odie.firebasestorage.app",messagingSenderId:"10660407067",appId:"1:10660407067:web:7e20b4ab80f4db542a55be"};
const app=initializeApp(firebaseConfig);const db=getDatabase(app);
onValue(ref(db,'commandes_restaurant'),(snap)=>{
 let div=document.getElementById('liste');let tot=document.getElementById('total-commandes');div.innerHTML="";if(!snap.exists()){div.innerHTML="<div class='card'>✅ Aucune commande</div>";tot.innerText="0 commande";return;}
 let c=0;snap.forEach(()=>c++);tot.innerText=c+" commande(s)";
 snap.forEach(cc=>{let r=cc.val();let k=cc.key;div.innerHTML+=`<div class="card"><span style="background:${r.pourcentage==50?'orange':'green'};color:white;padding:4px 8px;border-radius:5px">${r.statut}</span> <small>${r.date}</small><br><b>👤 ${r.nom}</b> - ${r.tel} - ${r.adresse||''}<br><hr>🍽️ ${r.details}<hr>💰 Total ${r.total} | Payé ${r.montantPaye} (${r.pourcentage}%)<br>Wave: ${r.waveId} | Code: ${r.codeCache}<div style="margin-top:10px"><button onclick="confirmer('${k}')" class="btn-oui">✅ REÇU</button> <button onclick="suppr('${k}')" class="btn-non">❌ REFUSER</button></div></div>`;});
});
window.confirmer=async(k)=>{if(confirm("Confirmer réception?")){const {ref:dbRef, remove:rem}=await import("https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js");await rem(ref(db,'commandes_restaurant/'+k));}};window.suppr=async(k)=>{if(confirm("Refuser?")){const {ref:dbRef, remove:rem}=await import("https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js");await rem(ref(db,'commandes_restaurant/'+k));}};
</script></body></html>
