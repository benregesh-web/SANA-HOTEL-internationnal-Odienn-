<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réception Restaurant - SANA FINAL</title>
<style>body{font-family:Arial;padding:15px;background:#f0f2f5;margin:0}.header{background:#111;color:white;padding:15px;text-align:center}.card{background:white;padding:15px;border-radius:12px;margin-bottom:12px;border-left:5px solid #25D366;box-shadow:0 2px 5px rgba(0,0,0,.1);white-space:pre-line}.btn-oui{background:#25D366;color:white;padding:14px;border:none;border-radius:8px;width:48%;font-weight:bold;cursor:pointer}.btn-non{background:#ff4444;color:white;padding:14px;border:none;border-radius:8px;width:48%;font-weight:bold;cursor:pointer}.banner-officiel{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}.banner-officiel img{width:100%;border-radius:8px;border:2px solid gold;height:120px;object-fit:cover} .badge{background:red;color:white;padding:3px 8px;border-radius:5px;font-size:11px}</style>
</head><body>
<script>if(prompt("Mot de passe Réception:")!=="SANA2024"){location.href="index.html"}</script>
<div class="header">
<h2>🍔 RÉCEPTION RESTAURANT - SANA FINAL</h2>
<div class="banner-officiel"><img src="menu-sana-officiel-1.jpg"><img src="menu-sana-officiel-2.jpg"><img src="menu-fastfood.jpg"></div>
<div style="background:red;color:white;padding:10px;border-radius:6px;font-weight:bold">🚫 UNE FOIS LA COMMANDE VALIDÉE, AUCUN REMBOURSEMENT 🚫<br><small>Même plat peut être commandé 10 fois ✅ - Pas de blocage comme chambre</small></div>
<div style="margin-top:8px"><a href="reception.html" style="color:yellow">→ Panel HÔTEL</a> | <a href="menu.html" style="color:white">→ Menu Client</a></div>
</div>
<div style="padding:15px">
<div style="background:white;padding:10px;border-radius:8px;margin-bottom:10px;text-align:center"><b id="total-commandes">Chargement...</b></div>
<div id="liste">Chargement...</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyD0_1oZblysKviAaknavtTZCoM68J9_GKY",authDomain:"sana-hotel-internationnal-odie.firebaseapp.com",databaseURL:"https://sana-hotel-internationnal-odie-default-rtdb.firebaseio.com",projectId:"sana-hotel-internationnal-odie",storageBucket:"sana-hotel-internationnal-odie.firebasestorage.app",messagingSenderId:"10660407067",appId:"1:10660407067:web:7e20b4ab80f4db542a55be"};
const app=initializeApp(firebaseConfig);const db=getDatabase(app);
onValue(ref(db,'commandes_restaurant'),(snap)=>{
 let div=document.getElementById('liste'); let totalEl=document.getElementById('total-commandes'); div.innerHTML="";
 if(!snap.exists()){div.innerHTML="<div class='card'>✅ Aucune commande - En attente</div>"; totalEl.innerText="0 commande"; return;}
 let count=0; snap.forEach(c=>count++); totalEl.innerText=count+" commande(s) en attente - 🚫 AUCUN REMBOURSEMENT SI VALIDÉ";
 snap.forEach(c=>{
  let r=c.val(); let k=c.key;
  div.innerHTML+=`<div class="card">
<span style="background:${r.pourcentage==50?'orange':'green'};color:white;padding:4px 8px;border-radius:5px">${r.statut}</span> <span class="badge">🚫 AUCUN REMBOURSEMENT</span> <small>${r.date}</small><br>
<b>👤 ${r.nom}</b> - 📞 ${r.tel} - 📍 ${r.adresse||'Sur place'}<br>
<hr>
🍽️ <b>COMMANDE CHOISIE (même plat plusieurs fois OK):</b>
${r.details}
<hr>
💰 Total commande: <b>${r.total} FCFA</b>
💳 Payé Wave: <b style="color:green">${r.montantPaye} FCFA (${r.pourcentage}%)</b>
${r.pourcentage==50?`💵 Reste à payer: <b style="color:red">${r.reste} FCFA - NON REMBOURSABLE</b>`:`✅ 100% PAYÉ - <b style="color:red">AUCUN REMBOURSEMENT</b>`}
🌊 ID Wave: <b>${r.waveId}</b> | Code: ${r.codeCache}
<div style="margin-top:10px">
<button onclick="confirmer('${k}', ${r.montantPaye})" class="btn-oui">✅ J'AI REÇU ${r.montantPaye} FCFA</button> <button onclick="suppr('${k}')" class="btn-non">❌ REFUSER</button>
</div>
</div>`;
 });
});
window.confirmer=async(k,montant)=>{
 if(confirm(`Tu confirmes avoir reçu ${montant} FCFA Wave? ATTENTION: Une fois validée, AUCUN REMBOURSEMENT!`)){
  await remove(ref(db,'commandes_restaurant/'+k));
  alert("✅ Commande validée! AUCUN REMBOURSEMENT possible après ça.");
 }
}
window.suppr=async(k)=>{
 if(confirm("Refuser cette commande? (Client non remboursé si déjà validée avant)")){
  await remove(ref(db,'commandes_restaurant/'+k));
 }
}
</script>
</body></html>
