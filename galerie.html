<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie Chambres - SANA HOTEL International Odienné</title>
  <link rel="stylesheet" href="style.css">
  
</head>

<body>
  <header class="navbar">
    <div class="logo">SANA HOTEL International Odienné</div>
  </header>
  <section class="galerie-chambres">
    <h2>Découvrez nos Chambres, Piscine & Sport</h2>
    <p id="info-stock" style="text-align:center;color:#666;"></p>
    <div class="filtres">
      <button class="btn-filtre active" data-filter="tout">Toutes</button>
      <button class="btn-filtre" data-filter="standard">STANDARD</button>
      <button class="btn-filtre" data-filter="classique">CLASSIQUE</button>
      <button class="btn-filtre" data-filter="confort">CONFORT</button>
      <button class="btn-filtre" data-filter="vip">VIP</button>
      <button class="btn-filtre" data-filter="vvip">VVIP</button>
      <button class="btn-filtre" data-filter="suite">SUITE</button>
      <button class="btn-filtre" data-filter="appartement">APPARTEMENT</button>
      <button class="btn-filtre" data-filter="sport" style="background:#ff9800;color:white;">SPORT</button>
      <button class="btn-filtre" data-filter="piscine" style="background:#00bcd4;color:white;">PISCINE</button>
    </div>
    <div class="grille-galerie" id="grille"></div>
  </section>
  <footer>
    <p>© 2026 SANA HOTEL International Odienné</p>
  </footer>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
    const firebaseConfig = {
      apiKey: "AIzaSyD0_1oZblysKviAaknavtTZCoM68J9_GKY",
      authDomain: "sana-hotel-internationnal-odie.firebaseapp.com",
      databaseURL: "https://sana-hotel-internationnal-odie-default-rtdb.firebaseio.com",
      projectId: "sana-hotel-internationnal-odie",
      storageBucket: "sana-hotel-internationnal-odie.firebasestorage.app",
      messagingSenderId: "10660407067",
      appId: "1:10660407067:web:7e20b4ab80f4db542a55be"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const categories = [
      { cat: "standard", label: "Standard", prix: 15000, imgs: ["standard1.webp", "standard2.webp"], type: "CHAMBRE" },
      { cat: "classique", label: "Classique", prix: 20000, imgs: ["classique3.webp", "classique4.webp"], type: "CHAMBRE" },
      { cat: "confort", label: "Confort", prix: 30000, imgs: ["confort5.webp", "confort6.webp"], type: "CHAMBRE" },
      { cat: "vip", label: "VIP", prix: 50000, imgs: ["vip7.webp", "vip8.webp"], type: "CHAMBRE" },
      { cat: "vvip", label: "VVIP", prix: 60000, imgs: ["vvip11.webp", "vvip12.webp"], type: "CHAMBRE" },
      { cat: "suite", label: "Suite", prix: 60000, imgs: ["suite9.webp", "suite10.webp"], type: "CHAMBRE" },
      { cat: "appartement", label: "Appartement", prix: 70000, imgs: ["appart1.webp", "appart2.webp"], type: "CHAMBRE" },
      { cat: "sport", label: "Salle de Sport", prix: 15000, imgs: ["sport15.webp", "sport16.webp"], type: "SPORT", info: "Abo 15000F / Séance 1500F - Lun, Mar, Jeu, Ven 19h-20h30" },
      { cat: "piscine", label: "Piscine", prix: 15000, imgs: ["eau13.webp", "eau14.webp"], type: "PISCINE", info: "Abo Adulte 15000F Enfant 8000F - Séance 1500F/1000F - 9h à 18h" },
    ];
    const STOCK_INIT = { "STANDARD": 12, "CLASSIQUE": 24, "CONFORT": 12, "VIP": 6, "VVIP": 2, "SUITE": 4, "APPARTEMENT": 4 };
    let stockActuel = STOCK_INIT;
    let filtreActuel = "tout";
    const grille = document.getElementById('grille');
    function render() {
      let html = "";
      categories.forEach(c => {
        if (filtreActuel !== "tout" && filtreActuel !== c.cat) return;
        if (c.type === "CHAMBRE") {
          let stock = stockActuel[c.cat.toUpperCase()] ?? 0;
          if (stock <= 0) return;
          c.imgs.forEach((img) => {
            html += ` <div class="item-galerie ${c.cat}"> <img src="${img}" alt="${c.label}" onclick="reserver('${c.label}', ${c.prix}, '${c.cat}', '${c.type}')"> <div class="info-img"> <h4>${c.label} <span style="background:#e8f5e9;color:#2e7d32;padding:2px 6px;border-radius:10px;font-size:10px;">${stock} dispo</span></h4> <p>${c.prix.toLocaleString()} FCFA</p> </div> </div>`;
          });
        } else {
          c.imgs.forEach((img) => {
            html += ` <div class="item-galerie ${c.cat}"> <img src="${img}" alt="${c.label}" onclick="reserver('${c.label}', ${c.prix}, '${c.cat}', '${c.type}')"> <div class="info-img"> <h4>${c.label} <span style="background:${c.type == 'SPORT' ? '#ff9800' : '#00bcd4'};color:white;padding:2px 6px;border-radius:10px;font-size:10px;">${c.type}</span></h4> <p>${c.info}</p> </div> </div>`;
          });
        }
      });
      if (html === "") html = "<p style='text-align:center;padding:20px;color:red;font-weight:bold'>🚫 Toutes les chambres de cette catégorie sont COMPLÈTES</p>";
      grille.innerHTML = html;
    }
    window.reserver = (label, prix, cat, type) => {
      if (type === "CHAMBRE") {
        let stock = stockActuel[cat.toUpperCase()] ?? 0;
        if (stock <= 0) {
          alert(label + " est COMPLET - Plus de chambres disponibles");
          return;
        }
      }
      window.location.href = `reservation.html?chambre=${encodeURIComponent(label)}&prix=${prix}&cat=${cat}&type=${type}`;
    }
    onValue(ref(db, 'stock'), snap => {
      if (!snap.exists()) {
        set(ref(db, 'stock'), STOCK_INIT);
        stockActuel = STOCK_INIT;
      } else {
        stockActuel = snap.val();
      }
      render();
    });
    document.querySelectorAll('.btn-filtre').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.btn-filtre').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        filtreActuel = b.dataset.filter;
        render();
      });
    });
    render();
  </script>
</body>

</html>
