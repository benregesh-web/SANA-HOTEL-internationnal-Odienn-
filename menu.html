<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu Restaurant - SANA</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:10px}
.grille-plats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item-plat{background:white;border-radius:12px;overflow:hidden;border:2px solid #2E8B57;cursor:pointer;position:relative}
.item-plat img{width:100%;height:180px;object-fit:cover;display:block}
.info-plat{padding:8px;text-align:center}
.info-plat h4{margin:5px 0;font-size:13px}
.info-plat p{margin:0;color:#25D366;font-weight:bold}
.badge-jour{position:absolute;top:5px;left:5px;background:#25D366;color:white;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:bold;z-index:2}
#banner-jour{background:#e8f5e9;border:2px solid #2E8B57;padding:12px;border-radius:10px;text-align:center;margin:10px 0}
#loading{text-align:center;padding:30px}
</style>
</head>
<body>
<h2 style="text-align:center">🍽️ MENU SANA HOTEL - ODIENNÉ</h2>

<div id="banner-jour" style="display:none">
<b>✅ Plats du jour - <span id="date-jour-client"></span> par <span id="rec-jour"></span></b><br>
<small id="info-jour-client" style="color:#2E8B57"></small>
</div>

<div id="loading">Chargement des plats du jour...</div>
<div id="container-menu"></div>

<div id="aucun-plat" style="display:none;background:white;padding:20px;border-radius:12px;text-align:center;margin:20px 0">
<h3>😔 Aucun plat validé aujourd'hui</h3>
<p>La réception n'a pas encore validé les plats du jour.<br>Appelez : 0757338010</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyD0_1oZblysKviAaknavtTZCoM68J9_GKY",authDomain:"sana-hotel-internationnal-odie.firebaseapp.com",databaseURL:"https://sana-hotel-internationnal-odie-default-rtdb.firebaseio.com",projectId:"sana-hotel-internationnal-odie",storageBucket:"sana-hotel-internationnal-odie.firebasestorage.app",messagingSenderId:"10660407067",appId:"1:10660407067:web:7e20b4ab80f4db542a55be"};
const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

async function chargerMenu(){
  try{
    let snapMenu = await get(child(ref(db),'menu_items'));
    let snapJour = await get(child(ref(db),'plats_du_jour_actuels'));

    if(!snapJour.exists()){
      document.getElementById('loading').style.display='none';
      document.getElementById('aucun-plat').style.display='block';
      return;
    }
    let dataJour = snapJour.val();
    document.getElementById('banner-jour').style.display='block';
    document.getElementById('date-jour-client').innerText=dataJour.date;
    document.getElementById('rec-jour').innerText=dataJour.receptionniste;
    document.getElementById('info-jour-client').innerText=dataJour.plats.length+" plats disponibles";

    // Si menu_items n'existe pas encore, on utilise l'ancien système
    let tousPlatsMap = {};
    if(snapMenu.exists()){
      snapMenu.forEach(c=>{ tousPlatsMap[c.val().nom]=c.val(); });
    }

    let container=document.getElementById('container-menu');
    container.innerHTML="";
    let html="";
    dataJour.plats.forEach(nomPlat=>{
      let item = tousPlatsMap[nomPlat];
      let prix = item? item.prix : 2500; // prix par défaut
      let img = item? item.photo : 'pouletalloco.png';
      let cat = item? item.cat : 'africain';
      html+=`<div class="item-plat ${cat}" onclick="commanderPlat('${nomPlat.replace(/'/g,"\\'")}', ${prix})"><div class="badge-jour">✅ DU JOUR</div><img src="${img}"><div class="info-plat"><h4>${nomPlat}</h4><p>${prix.toLocaleString()} FCFA</p></div></div>`;
    });
    container.innerHTML=`<div class="grille-plats">${html}</div><p style="text-align:center;margin-top:20px"><a href="commande.html" style="background:#25D366;color:white;padding:12px 20px;border-radius:8px;text-decoration:none;font-weight:bold">Voir mon panier →</a></p>`;
    document.getElementById('loading').style.display='none';
  }catch(e){ console.log(e); document.getElementById('loading').innerText="Erreur: "+e.message; }
}
chargerMenu();
window.commanderPlat=function(nom,prix){
  let panier=JSON.parse(localStorage.getItem('panierSana'))||[];
  let exist=panier.find(i=>i.nom===nom);
  if(exist) exist.qte+=1; else panier.push({nom:nom,prix:prix,qte:1});
  localStorage.setItem('panierSana',JSON.stringify(panier));
  window.location.href='commande.html?plat='+encodeURIComponent(nom)+'&prix='+prix;
}
</script>
</body>
</html>
