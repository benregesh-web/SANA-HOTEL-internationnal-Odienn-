<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test SANA V2</title></head>
<body style="font-family:sans-serif;padding:20px;text-align:center">
<h2>TEST PAIEMENT SANA V2 - SANS BLOCAGE</h2>
<button id="btn" style="padding:20px;background:green;color:white;font-size:20px;border:none;border-radius:10px;width:100%">PAYER 100 FCFA - METHODE 2</button>
<p id="log"></p>
<script>
document.getElementById('btn').onclick = async () => {
  document.getElementById('log').innerText = "Connexion CinetPay...";
  try {
    const data = {
      apikey: "sk_test_" + "XSKp1FXthmUwmL08AvZwWXBT",
      site_id: "445611",
      transaction_id: "SANA-" + Date.now(),
      amount: 100,
      currency: "XOF",
      description: "Test SANA HOTEL",
      notify_url: "https://benregesh-web.github.io/",
      return_url: "https://benregesh-web.github.io/SANA-HOTEL-internationnal-Odienn-/test-paiement.html",
      channels: "ALL",
      customer_name: "SANA",
      customer_surname: "Client",
      customer_phone_number: "0507199174"
    };
    const res = await fetch("https://api-checkout.cinetpay.com/v2/payment", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(data)
    });
    const result = await res.json();
    document.getElementById('log').innerText = JSON.stringify(result);
    if(result.code === "201" || result.data?.payment_url){
      window.location.href = result.data.payment_url;
    } else {
      alert("Erreur: " + JSON.stringify(result));
    }
  } catch(e){ alert("Erreur reseau: "+e); document.getElementById('log').innerText = e; }
};
</script>
</body></html>
